packages:
  - apps/*
  - packages/*

# --- Dependency strictness -------------------------------------------------
# pnpm >= 11 reads pnpm-specific settings from this file only (not .npmrc).
# strictPeerDependencies: a missing or incompatible peer fails `pnpm install`
#   instead of printing a warning, so peer problems surface in the PR that
#   causes them, not weeks later as a runtime bug.
# autoInstallPeers: false — every peer must be declared explicitly by the
#   workspace that needs it, so the dependency graph is visible in package.json.
strictPeerDependencies: true
autoInstallPeers: false
# Refuse to install on a Node/pnpm version outside `engines`.
engineStrict: true
# Use the exact version from the catalog/lockfile when adding a dependency.
savePrefix: "^"

# Dependencies allowed to run install scripts. Everything else is blocked
# (pnpm default). Prebuilt binaries cover sharp/unrs-resolver, so none needed.
allowBuilds:
  sharp: false
  unrs-resolver: false

# --- Catalog ----------------------------------------------------------------
# Single source of truth for versions shared across workspaces. Reference with
# `"<pkg>": "catalog:"` in package.json. Bump here, then `pnpm install`.
catalog:
  # Runtime
  react: ^19.3.1
  react-dom: ^19.3.1
  zod: ^4.6.7
  next: ^16.4.3
  radix-ui: ^1.8.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  react-router: ^8.5.1
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-query-devtools": ^5.105.0
  react-hook-form: ^7.91.0
  "@hookform/resolvers": ^6.0.2

  # Build
  # TypeScript 7 (native compiler) is out, but typescript-eslint's typed
  # linting supports `>=4.8.4 <6.1.0`. Pin to 6.0.x until it supports 7.
  typescript: ~6.0.3
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/turbopack": ^4.3.3
  turbo: ^2.11.10
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # Lint / format
  # ESLint 10 is out, but eslint-plugin-react and eslint-plugin-jsx-a11y
  # (pulled in by eslint-config-next) only declare support for ESLint <= 9.
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  typescript-eslint: ^8.72.1
  eslint-config-next: ^16.4.3
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-simple-import-sort: ^14.0.0
  eslint-plugin-turbo: ^2.11.10
  "@eslint-community/eslint-plugin-eslint-comments": ^4.8.1
  globals: ^17.13.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  dependency-cruiser: ^18.7.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4

  # Test
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  jsdom: ^30.1.3
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.8
  "@playwright/test": ^1.64.1
