version: 2
updates:
  # pnpm workspace (root lockfile). Security fixes open immediately; version
  # bumps are grouped weekly so they arrive as one reviewable PR per group.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@next/*", "eslint-config-next"]
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
