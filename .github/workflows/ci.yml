name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR: a new push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turborepo remote cache (Vercel or self-hosted). Leave unset to use local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Public build-time config. Override per environment via repository variables.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
  NEXT_PUBLIC_PLAY_STORE_URL: ${{ vars.NEXT_PUBLIC_PLAY_STORE_URL || 'https://play.google.com/store/apps/details?id=in.truckbuck.driver' }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:4000/v1' }}
  VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'test' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so `turbo --affected` can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0 # version read from package.json "packageManager"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PRs: only workspaces changed vs the base branch (and their dependents).
      # main: everything — remote cache makes unchanged tasks instant.
      - name: Turbo (affected)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run lint lint:deps typecheck test build --affected

      - name: Turbo (all)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run lint lint:deps typecheck test build

      - name: Format check
        run: pnpm format:check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: "**/coverage/lcov.info"
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @truckbuck/admin exec playwright install --with-deps chromium

      - name: Turbo e2e (affected)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run test:e2e --affected

      - name: Turbo e2e (all)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run test:e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7

