name: Security

# Secret scanning on every push/PR (gitleaks, full history on main) and a
# dependency audit. Also enable GitHub's own secret scanning + push
# protection: Settings → Code security (see SECURITY.md).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly audit even without commits

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --redact --no-banner --exit-code 1

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # High and critical advisories fail the build; moderate ones are left
      # to Dependabot's weekly PRs.
      - run: pnpm audit --prod --audit-level high
