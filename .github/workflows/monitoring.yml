name: Monitoring

# Production uptime (every 15 min) and the daily real-user web-vitals check.
# A failure opens (or comments on) one GitHub issue per check, so alerts reach
# whoever watches the repository. Configure:
#   vars.PROD_SITE_URL                      e.g. https://truckbuck.in
#   secrets.SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SITE_SECRET
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    name: Uptime (/ and /api/estimate)
    if: vars.PROD_SITE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check endpoints
        env:
          SITE: ${{ vars.PROD_SITE_URL }}
        run: |
          set -u
          fail=0
          check() { # url expected-status
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$1")
            echo "$1 -> $code (expected $2)"
            [ "$code" = "$2" ] || fail=1
          }
          check "$SITE/" 200
          # Valid request without the bot-check cookie: 403 proves the route,
          # validation and cookie check are up without spending a Maps call.
          check "$SITE/api/estimate?from=area:chennai&to=area:madurai&truck=lcv-14ft&date=2099-01-01" 403
          exit $fail

      - name: Open or update the outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Uptime check failing"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          body="Uptime check failed at $(date -u +%FT%TZ): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$number" ]; then gh issue comment "$number" -R "$GITHUB_REPOSITORY" -b "$body";
          else gh issue create -R "$GITHUB_REPOSITORY" -t "$title" -b "$body" -l incident; fi

  web-vitals:
    name: Real-user web vitals (p75)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check p75 LCP / INP / CLS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SITE_SECRET: ${{ secrets.SUPABASE_SITE_SECRET }}
        run: node apps/marketing/scripts/vitals-alert.mjs

      - name: Open or update the web-vitals issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Web vitals over budget (p75)"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          body="Mobile p75 over budget on $(date -u +%F): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$number" ]; then gh issue comment "$number" -R "$GITHUB_REPOSITORY" -b "$body";
          else gh issue create -R "$GITHUB_REPOSITORY" -t "$title" -b "$body" -l performance; fi
